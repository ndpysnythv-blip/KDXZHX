<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹窗测试</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div id="welcome-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); display: flex; align-items: center; justify-content: center; z-index: 9999; overflow: hidden;">
        <div style="background-color: white; border-radius: 12px; padding: 32px; max-width: 400px; width: 90%; box-shadow: 0 20px 40px rgba(0,0,0,0.2); text-align: center;">
            <div style="width: 64px; height: 64px; background-color: #fef3c7; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                <i class="fa-solid fa-gift" style="font-size: 32px; color: #eab308;"></i>
            </div>
            <h3 style="font-size: 20px; font-weight: bold; margin-bottom: 12px; color: #111111;">温馨提示</h3>
            <p style="color: #374151; margin-bottom: 12px; line-height: 1.6;">
                订单确认收货好评后<br>
                <span style="font-weight: 600; color: #111111;">自动发文件教程的提取码</span>
            </p>
            <p style="font-size: 12px; color: #6b7280; margin-bottom: 24px;">
                *非强制性操作，您也可以花¥40单独购买文件教程或上网寻找相关教程
            </p>
            <button 
                id="welcome-confirm-btn" 
                style="width: 100%; padding: 12px 24px; background-color: #111111; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 500; cursor: not-allowed; opacity: 0.5;"
                disabled
            >
                <span id="welcome-timer">请阅读3秒后点击</span>
            </button>
        </div>
    </div>

    <h1>测试页面</h1>
    <p>这是一个测试页面，弹窗应该在页面加载时显示。</p>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const welcomeModal = document.getElementById('welcome-modal');
            const welcomeConfirmBtn = document.getElementById('welcome-confirm-btn');
            const welcomeTimer = document.getElementById('welcome-timer');
            
            let countdown = 3;
            const countdownInterval = setInterval(() => {
                countdown--;
                if (countdown > 0) {
                    welcomeTimer.textContent = `请阅读${countdown}秒后点击`;
                } else {
                    clearInterval(countdownInterval);
                    welcomeTimer.textContent = '我知道了';
                    welcomeConfirmBtn.style.opacity = '1';
                    welcomeConfirmBtn.style.cursor = 'pointer';
                    welcomeConfirmBtn.disabled = false;
                }
            }, 1000);
            
            welcomeConfirmBtn.addEventListener('click', () => {
                welcomeModal.style.display = 'none';
            });
        });
    </script>
</body>
</html>
